<article
  class="surface-card overflow-hidden"
  [class.grid]="industry().featured"
  [class.lg:grid-cols-2]="industry().featured"
>
  <div
    class="relative overflow-hidden"
    [class.h-56]="!industry().featured"
    [class.md:h-64]="!industry().featured"
    [class.min-h-72]="industry().featured"
    [class.lg:h-full]="industry().featured"
  >
    @if (!imageFailed()) {
      <img
        [src]="industry().imageSrc"
        [alt]="industry().imageAltKey | translate"
        width="1600"
        height="1000"
        class="h-full w-full object-cover"
        loading="lazy"
        (error)="onImageError()"
      />
    } @else {
      <div class="image-fallback h-full min-h-56"></div>
    }
    <div class="absolute inset-0 bg-gradient-to-t from-navy/70 via-navy/10 to-transparent"></div>
    <span class="absolute start-4 top-4 rounded-full bg-white/92 px-3 py-1 text-[11px] font-bold text-navy">
      {{ industry().badgeKey | translate }}
    </span>
  </div>

  <div class="p-6 md:p-8" [class.lg:p-10]="industry().featured">
    <h3 class="text-2xl font-semibold text-navy" [class.md:text-3xl]="industry().featured">
      {{ industry().nameKey | translate }}
    </h3>
    <p class="mt-3 text-sm leading-7 text-copy" [class.md:text-base]="industry().featured">
      {{ industry().descriptionKey | translate }}
    </p>
    <ul class="mt-5 grid gap-2.5">
      @for (item of industry().workflowKeys; track item) {
        <li class="flex items-start gap-2 text-sm text-ink">
          <span class="mt-0.5 text-teal">
            <app-icon name="check" size="16" />
          </span>
          <span>{{ item | translate }}</span>
        </li>
      }
    </ul>
    <div class="mt-6">
      <app-cta-button
        labelKey="cta.discoverSolution"
        [href]="industry().ctaTarget"
        variant="ghost"
        ctaId="industry-discover"
      />
    </div>
  </div>
</article>
