<header class="nav-glass sticky top-0 z-40">
  <div class="section-shell flex items-center justify-between gap-4 py-3">
    <a href="#home" class="flex items-center gap-2.5 text-white" (click)="closeMenu()">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-cyan/15 ring-1 ring-cyan/30">
        <svg viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true">
          <circle cx="12" cy="12" r="8.2" fill="none" stroke="#22d3ee" stroke-width="1.7" />
          <path d="M10.2 8.4 16.4 12 10.2 15.6Z" fill="#22d3ee" />
        </svg>
      </span>
      <span class="font-display text-lg font-bold tracking-tight">{{ brand.name }}</span>
    </a>

    <nav class="hidden items-center gap-7 lg:flex" aria-label="Primary">
      @for (link of links; track link.href) {
        <a [href]="link.href" class="text-sm font-semibold text-slate-200/90 transition hover:text-cyan">
          {{ link.labelKey | translate }}
        </a>
      }
    </nav>

    <div class="hidden items-center gap-3 lg:flex">
      <div class="flex overflow-hidden rounded-full border border-white/10 text-xs font-bold">
        <button
          type="button"
          class="px-2.5 py-1.5"
          [class.bg-cyan]="currentLang() === 'en'"
          [class.text-navy]="currentLang() === 'en'"
          [class.text-slate-300]="currentLang() !== 'en'"
          (click)="setEnglish()"
        >
          {{ 'cta.langEn' | translate }}
        </button>
        <button
          type="button"
          class="px-2.5 py-1.5"
          [class.bg-cyan]="currentLang() === 'ar'"
          [class.text-navy]="currentLang() === 'ar'"
          [class.text-slate-300]="currentLang() !== 'ar'"
          (click)="setArabic()"
        >
          {{ 'cta.langAr' | translate }}
        </button>
      </div>
      <app-cta-button
        labelKey="cta.requestTrial"
        [href]="brand.phoneTel"
        variant="primary"
        ctaId="nav-trial"
      />
    </div>

    <button
      type="button"
      class="grid h-11 w-11 place-items-center rounded-full border border-white/15 text-white lg:hidden"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuLabelKey() | translate"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <app-icon name="close" />
      } @else {
        <app-icon name="menu" />
      }
    </button>
  </div>

  @if (menuOpen()) {
    <div class="border-t border-white/10 bg-navy-deep px-5 py-5 lg:hidden">
      <nav class="grid gap-2" aria-label="Mobile">
        @for (link of links; track link.href) {
          <a
            [href]="link.href"
            class="rounded-xl px-3 py-3 text-base font-semibold text-slate-100"
            (click)="closeMenu()"
          >
            {{ link.labelKey | translate }}
          </a>
        }
      </nav>
      <div class="mt-4 flex items-center justify-between gap-3">
        <div class="flex overflow-hidden rounded-full border border-white/10 text-xs font-bold">
          <button
            type="button"
            class="px-3 py-2"
            [class.bg-cyan]="currentLang() === 'en'"
            [class.text-navy]="currentLang() === 'en'"
            [class.text-slate-300]="currentLang() !== 'en'"
            (click)="setEnglish()"
          >
            {{ 'cta.langEn' | translate }}
          </button>
          <button
            type="button"
            class="px-3 py-2"
            [class.bg-cyan]="currentLang() === 'ar'"
            [class.text-navy]="currentLang() === 'ar'"
            [class.text-slate-300]="currentLang() !== 'ar'"
            (click)="setArabic()"
          >
            {{ 'cta.langAr' | translate }}
          </button>
        </div>
      </div>
      <div class="mt-4" (click)="closeMenu()">
        <app-cta-button
          labelKey="cta.requestTrial"
          [href]="brand.phoneTel"
          variant="primary"
          ctaId="nav-mobile-trial"
          [fullWidth]="true"
        />
      </div>
    </div>
  }
</header>
