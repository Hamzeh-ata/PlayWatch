<article class="border-b border-line py-4">
  <h3>
    <button
      type="button"
      class="flex w-full items-center justify-between gap-4 py-1 text-start"
      [attr.aria-expanded]="open()"
      (click)="onToggle()"
    >
      <span class="text-base font-semibold text-navy">{{ item().questionKey | translate }}</span>
      <span class="text-muted transition" [class.rotate-180]="open()">
        <app-icon name="chevron" />
      </span>
    </button>
  </h3>
  @if (open()) {
    <p class="mt-2 max-w-3xl text-sm leading-7 text-copy">{{ item().answerKey | translate }}</p>
  }
</article>
